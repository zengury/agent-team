<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SweetLoaf 烘焙坊 · 管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f0eb;color:#3d3226;min-height:100vh}
.h{background:linear-gradient(135deg,#c8963e,#8b6914);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.h h1{font-size:20px}.h span{opacity:.7;font-size:12px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px}
.c{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.c .l{font-size:11px;color:#999;margin-bottom:4px}.c .v{font-size:26px;font-weight:700}
.c.gold{border-left:4px solid #c8963e}.c.green{border-left:4px solid #4caf50}.c.blue{border-left:4px solid #2196f3}.c.red{border-left:4px solid #e74c3c}
.tabs{display:flex;gap:0;margin:0 14px}
.tab{padding:8px 18px;border:1px solid #ddd;border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;background:#fff;color:#999;transition:.2s}
.tab:hover{background:#f9f5f0}
.tab.a{background:#c8963e;color:#fff;border-color:#c8963e}
.panel{background:#fff;margin:0 14px 14px;border-radius:0 10px 10px 10px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:none}
.panel.on{display:block}
table{width:100%;border-collapse:collapse;margin-top:8px}
th{background:#faf7f2;text-align:left;padding:10px 12px;font-size:12px;color:#999;border-bottom:2px solid #eee}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid #f0ebe0}
tr:hover{background:#fdf9f4}
.badge{padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
.badge.warn{background:#fff3e0;color:#e65100}.badge.ok{background:#e8f5e9;color:#2e7d32}.badge.info{background:#e3f2fd;color:#1565c0}
.empty{text-align:center;color:#ccc;padding:40px;font-size:14px}
@media(max-width:600px){.g{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="h">
  <div><h1>🥖 SweetLoaf 烘焙坊</h1><span>数字化管理系统 · 台南</span></div>
  <div style="text-align:right;font-size:13px">👤 陈老板<br><span style="font-size:10px;opacity:.5" id="updateTime"></span></div>
</div>

<div class="g">
  <div class="c gold"><div class="l">🏪 门店总数</div><div class="v" id="storeCount">-</div></div>
  <div class="c green"><div class="l">📋 订单</div><div class="v" id="orderCount">-</div></div>
  <div class="c blue"><div class="l">👥 员工</div><div class="v" id="employeeCount">-</div></div>
  <div class="c red"><div class="l">⚠️ 库存预警</div><div class="v" id="alertCount">-</div></div>
</div>

<div class="tabs">
  <div class="tab a" onclick="showTab('orders',this)">📋 订单</div>
  <div class="tab" onclick="showTab('stores',this)">🏪 门店</div>
  <div class="tab" onclick="showTab('inventory',this)">📦 库存</div>
  <div class="tab" onclick="showTab('products',this)">🍞 产品</div>
  <div class="tab" onclick="showTab('employees',this)">👥 员工</div>
  <div class="tab" onclick="showTab('members',this)">💳 会员</div>
</div>

<div id="orders" class="panel on"><h3 style="margin-bottom:10px">📋 订单列表</h3><div id="orderTable"></div></div>
<div id="stores" class="panel"><h3 style="margin-bottom:10px">🏪 门店列表</h3><div id="storeTable"></div></div>
<div id="inventory" class="panel"><h3 style="margin-bottom:10px">📦 原料库存</h3><div id="inventoryTable"></div></div>
<div id="products" class="panel"><h3 style="margin-bottom:10px">🍞 产品目录</h3><div id="productTable"></div></div>
<div id="employees" class="panel"><h3 style="margin-bottom:10px">👥 员工列表</h3><div id="employeeTable"></div></div>
<div id="members" class="panel"><h3 style="margin-bottom:10px">💳 会员列表</h3><div id="memberTable"></div></div>

<script>
const API = 'http://localhost:5099/api';

async function load(k) { 
  try { let r = await fetch(API+'/'+k); let d = await r.json(); return d.data||d||[] }
  catch(e) { console.error(k, e); return [] }
}

async function init(){
  let [stores, orders, emp, inv, products, members] = await Promise.all([
    load("stores"), load("orders"), load("employees"), load("inventory"), load("products"), load("members")
  ]);
  
  document.getElementById("storeCount").textContent = stores.length;
  document.getElementById("orderCount").textContent = orders.length;
  document.getElementById("employeeCount").textContent = emp.length;
  let alerts = inv.filter(i => i.quantity < (i.min_quantity||10));
  document.getElementById("alertCount").textContent = alerts.length;
  document.getElementById("updateTime").textContent = new Date().toLocaleTimeString('zh-TW');

  function tbl(headers, rows) {
    let h = '<tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr>';
    if(!rows.length) return h+'<tr><td colspan="'+headers.length+'" class="empty">暂无数据</td></tr>';
    return h+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('');
  }

  document.getElementById("storeTable").innerHTML = tbl(
    ['门店','地址','电话','状态'],
    stores.map(s=>[`<strong>${s.name}</strong>`, s.location||'-', s.phone||'-', s.is_active?'<span class="badge ok">营业中</span>':'<span class="badge warn">已关闭</span>'])
  );
  document.getElementById("orderTable").innerHTML = tbl(
    ['#','客户','渠道','商品','金额','状态'],
    orders.map(o=>[
      `<strong>#${o.id}</strong>`, o.customer_name||'-', o.channel||'-',
      (o.items||[]).map(i=>i.product_name+' x'+i.quantity).join(', ')||'-',
      'NT$'+(o.total_amount||0),
      o.status=='completed'?'<span class="badge ok">已完成</span>':'<span class="badge warn">'+ (o.status||'处理中') +'</span>'
    ])
  );
  document.getElementById("inventoryTable").innerHTML = tbl(
    ['原料','库存','单位','最低库存','状态'],
    inv.map(i=>[
      `<strong>${i.name||i.ingredient_name||'-'}</strong>`, i.quantity||0, i.unit||'-', i.min_quantity||10,
      i.quantity<(i.min_quantity||10)?'<span class="badge warn">⚠️ 需补货</span>':'<span class="badge ok">✅ 充足</span>'
    ])
  );
  document.getElementById("productTable").innerHTML = tbl(
    ['产品','类别','单价'],
    products.map(p=>[`<strong>${p.name}</strong>`, p.category||'-', 'NT$'+(p.unit_price||0)])
  );
  document.getElementById("employeeTable").innerHTML = tbl(
    ['姓名','职位','门店','电话'],
    emp.map(e=>[`<strong>${e.name}</strong>`, e.position||'-', e.store_name||'-', e.phone||'-'])
  );
  document.getElementById("memberTable").innerHTML = tbl(
    ['姓名','手机','积分','等级'],
    members.map(m=>[
      `<strong>${m.name}</strong>`, m.phone||'-', m.points||0,
      (m.points||0)>500?'<span class="badge info">钻石</span>':(m.points||0)>200?'<span class="badge ok">黄金</span>':'<span class="badge warn">普通</span>'
    ])
  );
}

function showTab(id, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('a'));
  el.classList.add('a');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}

init();
setInterval(init, 30000);
</script>
</body>
</html>
