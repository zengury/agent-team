[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-team"
version = "0.1.0"
description = "西游Agent团队 — Journey to the West themed five-agent AI delivery team for SME clients"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.30",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.8",
]

[project.scripts]
agent-team = "agent_team.main:cli"
agent-team-cp = "agent_team.control_plane.server:main"

[tool.setuptools.packages.find]
where = ["src"]
